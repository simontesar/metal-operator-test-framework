---
- name: Install k3s server on master
  hosts: master
  become: true
  vars:
    k3s_bind_address: "0.0.0.0"
    k3s_install_exec: >-
      server --bind-address {{ k3s_bind_address }}
      --tls-san {{ ansible_host }}
      --write-kubeconfig-mode 644

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Install k3s server
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_EXEC: "{{ k3s_install_exec }}"
      args:
        creates: /usr/local/bin/k3s
        executable: /bin/bash

    - name: Enable and start k3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for k3s node to be Ready
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_nodes
      until: k3s_nodes.stdout is search(' Ready ')
      retries: 12
      delay: 10
      changed_when: false

    - name: Allow non-root read of k3s kubeconfig
      ansible.builtin.file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    - name: Ensure .kube directory for vagrant user
      ansible.builtin.file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0700"

    - name: Install kubeconfig for vagrant user
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/vagrant/.kube/config
        remote_src: true
        owner: vagrant
        group: vagrant
        mode: "0600"

    - name: Fetch kubeconfig to playbook directory
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

    - name: Rewrite server address for host access
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig"
        regexp: 'server: https://[^:]+:6443'
        replace: "server: https://{{ ansible_host }}:6443"
      delegate_to: localhost
      become: false
