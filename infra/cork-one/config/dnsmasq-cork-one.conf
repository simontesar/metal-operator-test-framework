# Bind only to trunk VLAN interfaces (not upstream, not shared NAT).
interface={{TRUNK_IF}}.100
interface={{TRUNK_IF}}.200
bind-interfaces
except-interface=lo

# Static-only DHCP per subnet (no dynamic lease pool).
dhcp-range=set:oob,172.16.100.0,static
dhcp-range=set:ib,10.250.200.0,static

# Static leases for node1/node2 (MACs from Vagrantfile).
dhcp-host=02:00:64:00:01:01,172.16.100.11,node1-idrac,infinite
dhcp-host=02:00:c8:00:01:01,10.250.200.11,node1-nic1,infinite
dhcp-host=02:00:64:00:02:01,172.16.100.12,node2-idrac,infinite
dhcp-host=02:00:c8:00:02:01,10.250.200.12,node2-nic1,infinite

# Gateways (tagged to match static-only ranges above).
dhcp-option=tag:oob,option:router,172.16.100.1
dhcp-option=tag:ib,option:router,10.250.200.1
