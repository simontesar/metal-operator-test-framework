# B3 — BMC reset (see cases.md)
# Targets the contoso Go mock (embedded data); graceful-restart-bmc maps to a
# Redfish Manager.Reset. Only A1 setup (registered BMC) is required.
# NOTE: cases.md also asserts status.lastResetTime, but the embedded contoso
# Managers/BMC data has no LastResetTime field, so metal-operator leaves it
# zero/null. That assertion is intentionally omitted here.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: b3-bmc-reset
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../resources/bmcsecret.yaml
        - apply:
            file: ../resources/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: graceful-restart-bmc
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                annotations:
                  metal.ironcore.dev/operation: graceful-restart-bmc
    - name: assert-bmc-reset-complete
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
              status:
                state: Enabled
