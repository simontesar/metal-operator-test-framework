# B2 — Power operations via operation annotation (see cases.md)
# Requires a mock with working dynamic features (embedded-data Go mock, e.g.
# contoso-go). The server is claimed first so it moves to Reserved, where the
# controller enforces the claim's desired power state; on an unclaimed Available
# server the controller would self-heal it back to powered-off, so annotation
# power-on could never persist.
#
# Each operation is applied via the metal.ironcore.dev/operation annotation,
# mapped to a Redfish ResetType by AnnotationToRedfishMapping. Each assert checks
# the annotation was consumed (removed). force-on/graceful-restart/power-cycle
# also assert powerState converges to On (stable, matching the claim's desired
# On). force-off-server asserts only that the annotation was consumed: a Reserved
# server is re-powered to the claim's desired On state, so a persistent Off
# cannot be asserted here.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: b2-power-annotation
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../resources/bmcsecret.yaml
        - apply:
            file: ../resources/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Available
    - name: claim-server
      try:
        - apply:
            file: ../resources/ignitionsecret.yaml
        - apply:
            file: ../resources/serverclaim.yaml
        - assert:
            timeout: 5m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Reserved
                powerState: "On"
    - name: force-on-server
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                annotations:
                  metal.ironcore.dev/operation: force-on-server
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
              status:
                powerState: "On"
    - name: graceful-restart-server
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                annotations:
                  metal.ironcore.dev/operation: graceful-restart-server
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
              status:
                powerState: "On"
    - name: power-cycle-server
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                annotations:
                  metal.ironcore.dev/operation: power-cycle-server
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
              status:
                powerState: "On"
    - name: force-off-server
      # Reserved server is re-powered to the claim's desired On state, so only
      # the annotation-consumed check is asserted here (no persistent Off).
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                annotations:
                  metal.ironcore.dev/operation: force-off-server
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
    - name: release-server
      try:
        - delete:
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: ServerClaim
              name: (join('-', ['compatibility', $namespace]))
