# B4 — Indicator LED (see cases.md)
# Requires a mock with working dynamic features (embedded-data Go mock, e.g.
# contoso-go) that persists the PATCH to the system IndicatorLED, so this is not
# skippable here.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: b4-indicator-led
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../resources/bmcsecret.yaml
        - apply:
            file: ../resources/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Available
    - name: led-lit
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                indicatorLED: Lit
    - name: assert-led-lit
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                indicatorLED: Lit
    - name: led-off
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                indicatorLED: "Off"
    - name: assert-led-off
      try:
        - assert:
            timeout: 1m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                indicatorLED: "Off"
