# B3 — Indicator LED
# - Kept as a separate test to be skippable for models that do not support LED control
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: b3-indicator-led
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../resources/bmcsecret.yaml
        - apply:
            file: ../resources/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Available
    - name: led-lit
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                indicatorLED: Lit
    - name: assert-led-lit
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                indicatorLED: Lit
    - name: led-off
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                indicatorLED: "Off"
    - name: assert-led-off
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                indicatorLED: "Off"
