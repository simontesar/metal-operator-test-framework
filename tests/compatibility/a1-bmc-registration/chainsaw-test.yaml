# A1 — BMC registration (see cases.md)
# basic-go mock populates model/firmwareVersion/powerState but not
# manufacturer or macAddress; assertions match that observed status.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: a1-bmc-registration
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../resources/bmcsecret.yaml
        - apply:
            file: ../resources/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            timeout: 2m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
                model: ($values.model)
                firmwareVersion: ($values.firmwareVersion)
                powerState: ($values.powerState)
