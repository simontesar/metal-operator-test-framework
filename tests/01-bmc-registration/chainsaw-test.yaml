# 01 — BMC registration
# Asserts model/firmwareVersion/powerState
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 01-bmc-registration
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
      cleanup:
        - sleep:
            duration: 10s
        - delete:
            timeout: 2m
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              labels:
                metal-operator-test-framework/namespace: ($namespace)
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
                model: ($values."01-bmc-registration".model)
                firmwareVersion: ($values.firmwareVersion)
                powerState: ($values."01-bmc-registration".powerState)
