# 01 — BMC registration
# Asserts model/firmwareVersion/powerState
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 01-bmc-registration
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
                model: ($values.model)
                firmwareVersion: ($values.firmwareVersion)
                powerState: ($values.powerState)
