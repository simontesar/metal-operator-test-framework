apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 09-persistent-boot-order
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Available
    - name: claim-server
      try:
        - apply:
            file: ignitionsecret.yaml
        - apply:
            file: serverclaim.yaml
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              status:
                state: Reserved
                powerState: "On"
    # Fetches the current boot order directly from the BMC's redfish API.
    # The Job needs to write the result into a ConfigMap for chainsaw to fetch
    # later. If the script was ran by chainsaw directly, network access to the
    # BMC would be necessary but is avoided by design of this framework.
    - name: discover-boot-order
      bindings:
        - name: systemURI
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', join('-', ['compatibility', $namespace, 'system-0'])).spec.systemURI)
      try:
        - apply:
            file: boot-order-discover.yaml
        - assert:
            timeout: 2m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: boot-order-discover
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
    # Use the fist four elements of the fetched boot order in reverse to have a
    # change in most cases.
    - name: patch-boot-order
      bindings:
        - name: discoveredBootOrder
          value: (split(x_k8s_get($client, 'v1', 'ConfigMap', $namespace, join('-', ['compatibility', $namespace, 'boot-order'])).data.order, ','))
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                bootOrder: (([{name:($discoveredBootOrder[-1]),device:($discoveredBootOrder[-1]),priority:`1`},{name:($discoveredBootOrder[-2]),device:($discoveredBootOrder[-2]),priority:`2`},{name:($discoveredBootOrder[-3]),device:($discoveredBootOrder[-3]),priority:`3`}])[?device != null])
    - name: assert-boot-order-on-bmc
      bindings:
        - name: jobName
          value: bootorder-check
        - name: systemURI
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', join('-', ['compatibility', $namespace, 'system-0'])).spec.systemURI)
        - name: discoveredBootOrder
          value: (map(&device, x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', join('-', ['compatibility', $namespace, 'system-0'])).spec.bootOrder))
      try:
        - apply:
            file: bootorder-check-job.yaml
        - assert:
            timeout: 2m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ($jobName)
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
    - name: power-cycle
      try:
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                annotations:
                  metal.ironcore.dev/operation: power-cycle-server
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
                (annotations."metal.ironcore.dev/operation" || 'absent'): 'absent'
              status:
                powerState: "On"
    - name: assert-boot-order-after-cycle
      bindings:
        - name: jobName
          value: bootorder-check-after-cycle
        - name: systemURI
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', join('-', ['compatibility', $namespace, 'system-0'])).spec.systemURI)
        - name: discoveredBootOrder
          value: (map(&device, x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', join('-', ['compatibility', $namespace, 'system-0'])).spec.bootOrder))
      try:
        - apply:
            file: bootorder-check-job.yaml
        - assert:
            timeout: 2m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ($jobName)
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
    - name: release-server
      try:
        - delete:
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: ServerClaim
              name: (join('-', ['compatibility', $namespace]))
