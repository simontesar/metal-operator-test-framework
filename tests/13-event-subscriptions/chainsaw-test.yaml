apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 13-event-subscriptions
spec:
  concurrent: false
  bindings:
    - name: serverName
      value: (join('-', ['compatibility', $namespace, 'system-0']))
    - name: operatorNamespace
      value: metal-maintenance-operator-system
    - name: operatorDeployment
      value: metal-maintenance-operator-controller-manager
    - name: metricsService
      value: metal-maintenance-operator-controller-manager-metrics-service
    - name: metricsReaderRole
      value: metal-maintenance-operator-metrics-reader
    - name: telemetryConfigName
      value: telemetry-collector-config
    - name: subscriptionFinalizer
      value: telemetry.metal.ironcore.dev/subscriptions
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
      cleanup:
        - sleep:
            duration: 10s
        - delete:
            timeout: 2m
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              labels:
                metal-operator-test-framework/namespace: ($namespace)
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    # The subscription controller matches the vendor against the Server's
    # manufacturer (Systems endpoint), not the BMC's (Manager endpoint).
    # See https://github.com/ironcore-dev/metal-maintenance-operator/blob/17a374da64c6fc9f4a4194044c75e753683cb504/internal/telemetry/subscriptions/reconciler.go#L545
    - name: assert-server-manufacturer
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: ($serverName)
              status:
                (manufacturer != null): true
    - name: subscribe
      bindings:
        - name: vendor
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'Server', '', $serverName).status.manufacturer)
        - name: model
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'BMC', '', join('-', ['compatibility', $namespace])).status.model)
      try:
        - apply:
            file: telemetry-config.yaml
        # The subscription controller watches BMCs, not its ConfigMap. Touch the
        # BMC so the new config is picked up without waiting for a requeue.
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                annotations:
                  metal-operator-test-framework/reconcile: subscribe
    # Create a Job to read the operator's metrics. When the test event health
    # check has completed, a BMC-specific Gauge should show up. This is the only
    # way success is signalled, there is no condition update on the BMC itself.
    - name: event-verification
      try:
        - apply:
            file: metrics-rbac.yaml
        - apply:
            file: event-verification-job.yaml
        - assert:
            timeout: 4m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: event-verification
              status:
                (conditions[?type == 'Complete' || type == 'Failed'] | [0].status): "True"
        - assert:
            timeout: 5s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: event-verification
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
      finally:
        - podLogs:
            selector: job-name=event-verification
    - name: unsubscribe
      try:
        - apply:
            file: telemetry-config-baseline.yaml
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                annotations:
                  metal-operator-test-framework/reconcile: unsubscribe
        # The finalizer is only released once every subscription was deleted.
        - assert:
            timeout: 2m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                (contains(finalizers || `[]`, $subscriptionFinalizer)): false
