apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 13-event-subscriptions
spec:
  concurrent: false
  bindings:
    - name: operatorNamespace
      value: metal-maintenance-operator-system
    - name: operatorDeployment
      value: metal-maintenance-operator-controller-manager
    - name: metricsService
      value: metal-maintenance-operator-controller-manager-metrics-service
    - name: metricsReaderRole
      value: metal-maintenance-operator-metrics-reader
    - name: telemetryConfigName
      value: telemetry-collector-config
    - name: subscriptionFinalizer
      value: telemetry.metal.ironcore.dev/subscriptions
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
      cleanup:
        - sleep:
            duration: 10s
        - delete:
            timeout: 2m
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              labels:
                metal-operator-test-framework/namespace: ($namespace)
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    # Event subscriptions are managed by the metal-maintenance-operator's
    # telemetry pipeline, which only subscribes BMCs of these vendors.
    - name: preconditions
      try:
        - assert:
            timeout: 30s
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                (contains(['Dell Inc.', 'HPE', 'Lenovo', 'Supermicro'], manufacturer)): true
                (model != null): true
        - assert:
            timeout: 30s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ($operatorDeployment)
                namespace: ($operatorNamespace)
              spec:
                template:
                  spec:
                    (length(containers[?name == 'manager'].args[] | [?@ == '--enable-telemetry' || @ == '--enable-telemetry=true']) > `0`): true
    - name: subscribe
      bindings:
        - name: vendor
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'BMC', '', join('-', ['compatibility', $namespace])).status.manufacturer)
        - name: model
          value: (x_k8s_get($client, 'metal.ironcore.dev/v1alpha1', 'BMC', '', join('-', ['compatibility', $namespace])).status.model)
      try:
        - apply:
            file: telemetry-config.yaml
        # The subscription controller watches BMCs, not its ConfigMap. Touch the
        # BMC so the new config is picked up without waiting for a requeue.
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                annotations:
                  metal-operator-test-framework/reconcile: subscribe
      # Restore ConfigMap to default value in case the run fails before the unsubscribe step
      cleanup:
        - script:
            env:
              - name: NAMESPACE
                value: ($operatorNamespace)
              - name: NAME
                value: ($telemetryConfigName)
            content: |
              kubectl -n "$NAMESPACE" create configmap "$NAME" --dry-run=client -o yaml \
                --from-literal=config.yaml='{"apiVersion":"telemetry.metal.ironcore.dev/v1alpha1","eventBasedHardware":[],"perBMCTimeout":"30s","subscriptionReconcileInterval":"10s"}' |
                kubectl apply -f -
    - name: assert-subscriptions-on-bmc
      bindings:
        - name: jobName
          value: events-check-present
        - name: mode
          value: present
      try:
        - apply:
            file: events-check-job.yaml
        - assert:
            timeout: 3m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ($jobName)
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
      catch:
        - podLogs:
            selector: (join('=', ['job-name', $jobName]))
    - name: assert-event-delivery
      try:
        - apply:
            file: metrics-check-job.yaml
        - assert:
            timeout: 4m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: events-metrics-check
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
      catch:
        - podLogs:
            selector: job-name=events-metrics-check
        - podLogs:
            namespace: ($operatorNamespace)
            selector: control-plane=controller-manager
            tail: 30
    - name: unsubscribe
      try:
        - apply:
            file: telemetry-config-baseline.yaml
        - patch:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                annotations:
                  metal-operator-test-framework/reconcile: unsubscribe
        # The finalizer is only released once every subscription was deleted.
        - assert:
            timeout: 2m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
                (contains(finalizers || `[]`, $subscriptionFinalizer)): false
    - name: assert-subscriptions-removed-from-bmc
      bindings:
        - name: jobName
          value: events-check-absent
        - name: mode
          value: absent
      try:
        - apply:
            file: events-check-job.yaml
        - assert:
            timeout: 3m
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: ($jobName)
              status:
                (conditions[?type == 'Complete'] | [0].status): "True"
      catch:
        - podLogs:
            selector: (join('=', ['job-name', $jobName]))
