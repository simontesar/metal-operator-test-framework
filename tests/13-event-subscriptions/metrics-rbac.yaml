apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-verification
  namespace: ($namespace)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: (join('-', ['event-verification', $namespace]))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ($metricsReaderRole)
subjects:
  - kind: ServiceAccount
    name: event-verification
    namespace: ($namespace)
