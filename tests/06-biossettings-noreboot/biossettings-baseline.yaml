apiVersion: system.metal.ironcore.dev/v1alpha1
kind: BIOSSettings
metadata:
  name: (join('-', ['compatibility', $namespace, 'baseline']))
spec:
  serverRef:
    name: (join('-', ['compatibility', $namespace, 'system-0']))
  version: ($values.biosVersion)
# Without a policy the metal-maintenance-operator creates a ServerMaintenance
# with an empty spec.policy, which the CRD's enum validation rejects
  serverMaintenancePolicy: Enforced
  settingsFlow:
    - name: noreboot
      priority: 1
      settings: (from_items([[($values."06-biossettings-noreboot".key), ($values."06-biossettings-noreboot".baselineValue)]]))
