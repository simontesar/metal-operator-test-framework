# 02 — Server discovery and inventory
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 02-discovery
spec:
  concurrent: false
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
      cleanup:
        - sleep:
            duration: 10s
        - delete:
            timeout: 2m
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              labels:
                metal-operator-test-framework/namespace: ($namespace)
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: (join('-', ['compatibility', $namespace]))
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: (join('-', ['compatibility', $namespace, 'system-0']))
              spec:
                (systemUUID != null): true
              status:
                state: Available
                powerState: "Off"
                (processors[?id != null] || `[]`):
                  (length(@) > `0`): true
                (networkInterfaces[0]):
                  (carrierStatus != null): true
                (totalSystemMemory != null): true
