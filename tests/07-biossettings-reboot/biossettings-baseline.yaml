apiVersion: system.metal.ironcore.dev/v1alpha1
kind: BIOSSettings
metadata:
  name: (join('-', ['compatibility', $namespace, 'baseline']))
spec:
  serverRef:
    name: (join('-', ['compatibility', $namespace, 'system-0']))
  version: ($values.biosVersion)
  serverMaintenancePolicy: Enforced
  settingsFlow:
    - name: reboot
      priority: 1
      settings: (from_items([[($values."07-biossettings-reboot".key), ($values."07-biossettings-reboot".baselineValue)]]))
