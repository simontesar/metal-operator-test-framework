# The test runs through three BIOSVersion resources:
# 1. Ensuring the baseline version as configured in biosVersion is installed. `14-biosversion-upgrade..baselineImageURI` must provide this version.
# 2. Installing 14-biosversion-upgrade.version
# 3. Restoring the baseline version
# This is necessary so that the server is kept in a clean state but also potentially deals with an earlier, interrupted test.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: 14-biosversion-upgrade
spec:
  concurrent: false
  bindings:
    - name: bmcName
      value: (join('-', ['compatibility', $namespace]))
    - name: serverName
      value: (join('-', [$bmcName, 'system-0']))
  steps:
    - name: register-bmc
      try:
        - apply:
            file: ../shared/bmcsecret.yaml
        - apply:
            file: ../shared/bmc.yaml
      cleanup:
        - sleep:
            duration: 10s
        - delete:
            timeout: 2m
            ref:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              labels:
                metal-operator-test-framework/namespace: ($namespace)
    - name: assert-bmc-enabled
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: BMC
              metadata:
                name: ($bmcName)
              status:
                state: Enabled
    - name: assert-server-available
      try:
        - assert:
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: ($serverName)
              status:
                state: Available
    # Ensure the version expected as baseline, potentially a no-op.
    - name: prepare-baseline
      try:
        - apply:
            bindings:
              - name: role
                value: baseline
              - name: version
                value: ($values.biosVersion)
              - name: imageURI
                value: ($values."14-biosversion-upgrade".baselineImageURI)
            file: biosversion.yaml
        # Fail fast on Failed instead of waiting for the assert timeout
        - assert:
            timeout: 20m
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'baseline']))
              status:
                (state == 'Completed' || state == 'Failed'): true
        - assert:
            timeout: 5s
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'baseline']))
              status:
                state: Completed
        - assert:
            timeout: 15m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: ($serverName)
                (annotations."metal.ironcore.dev/operation" == null): true
              status:
                state: Available
                biosVersion: ($values.biosVersion)
        - delete:
            timeout: 2m
            ref:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              name: (join('-', [$bmcName, 'baseline']))
      catch:
        - describe:
            apiVersion: system.metal.ironcore.dev/v1alpha1
            kind: BIOSVersion
        - podLogs:
            namespace: metal-maintenance-operator-system
            selector: control-plane=controller-manager
            tail: 200
    - name: upgrade
      try:
        - apply:
            bindings:
              - name: role
                value: upgrade
              - name: version
                value: ($values."14-biosversion-upgrade".version)
              - name: imageURI
                value: ($values."14-biosversion-upgrade".imageURI)
            file: biosversion.yaml
        - assert:
            timeout: 20m
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'upgrade']))
              status:
                (state == 'Completed' || state == 'Failed'): true
        - assert:
            timeout: 5s
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'upgrade']))
              status:
                state: Completed
                (conditions[?type == 'VersionUpgradeIssued'] | [0].status): "True"
                (conditions[?type == 'VersionUpgradeCompleted'] | [0].status): "True"
                (conditions[?type == 'VersionUpgradeCompleted'] | [0].reason): UpgradeTaskCompleted
                (conditions[?type == 'VersionUpgradeRebootIssued'] | [0].status): "True"
                (conditions[?type == 'VersionUpgradePowerOn'] | [0].status): "True"
                (conditions[?type == 'VersionUpgradeVerification'] | [0].status): "True"
                upgradeTask:
                  (URI != ''): true
      catch:
        - describe:
            apiVersion: system.metal.ironcore.dev/v1alpha1
            kind: BIOSVersion
        - describe:
            apiVersion: maintenance.metal.ironcore.dev/v1alpha1
            kind: ServerMaintenance
            namespace: metal-maintenance-operator-system
        - podLogs:
            namespace: metal-maintenance-operator-system
            selector: control-plane=controller-manager
            tail: 200
    - name: assert-upgraded
      try:
        - assert:
            timeout: 15m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: ($serverName)
                (annotations."metal.ironcore.dev/operation" == null): true
              status:
                state: Available
                biosVersion: ($values."14-biosversion-upgrade".version)
    - name: restore-baseline
      try:
        - delete:
            timeout: 2m
            ref:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              name: (join('-', [$bmcName, 'upgrade']))
        - apply:
            bindings:
              - name: role
                value: baseline
              - name: version
                value: ($values.biosVersion)
              - name: imageURI
                value: ($values."14-biosversion-upgrade".baselineImageURI)
            file: biosversion.yaml
        - assert:
            timeout: 20m
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'baseline']))
              status:
                (state == 'Completed' || state == 'Failed'): true
        - assert:
            timeout: 5s
            resource:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              metadata:
                name: (join('-', [$bmcName, 'baseline']))
              status:
                state: Completed
                (conditions[?type == 'VersionUpgradeIssued'] | [0].status): "True"
                (conditions[?type == 'VersionUpgradeVerification'] | [0].status): "True"
        - assert:
            timeout: 15m
            resource:
              apiVersion: metal.ironcore.dev/v1alpha1
              kind: Server
              metadata:
                name: ($serverName)
                (annotations."metal.ironcore.dev/operation" == null): true
              status:
                state: Available
                biosVersion: ($values.biosVersion)
        - delete:
            timeout: 2m
            ref:
              apiVersion: system.metal.ironcore.dev/v1alpha1
              kind: BIOSVersion
              name: (join('-', [$bmcName, 'baseline']))
      catch:
        - describe:
            apiVersion: system.metal.ironcore.dev/v1alpha1
            kind: BIOSVersion
        - podLogs:
            namespace: metal-maintenance-operator-system
            selector: control-plane=controller-manager
            tail: 200
