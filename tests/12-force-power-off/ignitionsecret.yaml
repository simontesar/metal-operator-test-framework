# Creates an empty file that serves as a flag to the metalprobe-image to ignore
# ACPI. See metalprobe-image/cmd/metalprobe-launcher/main.go.
apiVersion: v1
kind: Secret
metadata:
  name: (join('-', ['compatibility', $namespace, 'ignition']))
type: Opaque
stringData:
  ignition: |
    {"ignition":{"version":"3.4.0"},"storage":{"files":[{"path":"/metalprobe/ignore-power-button","contents":{"source":"data:,"}}]}}
