apiVersion: baseboard.metal.ironcore.dev/v1alpha1
kind: BMCSettings
metadata:
  name: (join('-', ['compatibility', $namespace, 'bmc']))
spec:
  bmcRef:
    name: (join('-', ['compatibility', $namespace]))
  version: ($values.firmwareVersion)
  serverMaintenancePolicy: Enforced
  settingsFlow:
    - name: bmc-setting
      priority: 1
      settings: (from_items([[($values.bmcSettingKey), ($values.bmcSettingValue)]]))
