apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metalprobe-mock-controller
  labels:
    app.kubernetes.io/name: metalprobe-mock-controller
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - metal.ironcore.dev
  resources:
  - serverbootconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - serverbootconfigurations/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - metal.ironcore.dev
  resources:
  - servers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
