apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls
  labels:
    app.kubernetes.io/name: redfish-mockup
    app.kubernetes.io/component: redfish-mockup
spec:
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: metal-operator-selfsigned-issuer
  secretName: PLACEHOLDER_TLS_SECRET
