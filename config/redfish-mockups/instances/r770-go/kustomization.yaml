# Instance overlay for the R770 iDRAC Go mockup client.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/go-mockup

namePrefix: redfish-r770-go-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: r770-go

patches:
- target:
    kind: Service
    name: mockup
  patch: |-
    - op: replace
      path: /spec/clusterIP
      value: 10.96.200.21
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/3
      value: /clients/R770_iDRAC10_1_10_17_00_mockup_client/redfish/v1
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /redfish-clients
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-r770-go-mockup
    - op: replace
      path: /spec/hostname
      value: dell-r770-go-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.21
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar
