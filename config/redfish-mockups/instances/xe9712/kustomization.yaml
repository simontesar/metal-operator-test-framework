# Instance overlay for the XE9712 iDRAC mockup client.
#
#   PLACEHOLDER_CLIENT -> /clients/XE9712_iDRAC10_1_30_07_10_mockup_client
#   PLACEHOLDER_CLIENTS_MOUNT -> /redfish-clients
#   PLACEHOLDER_TLS_SECRET -> redfish-xe9712-tls
#   PLACEHOLDER_BMC_SECRET_NAME -> redfish-xe9712-mockup
#   PLACEHOLDER_HOSTNAME -> dell-xe9712-mockup
#   PLACEHOLDER_BMC_IP -> 10.96.200.13
#   PLACEHOLDER_USERNAME / PLACEHOLDER_PASSWORD -> foo / bar
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/mockup

namePrefix: redfish-xe9712-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: xe9712

patches:
# Resolves PLACEHOLDER_BMC_IP (Service clusterIP)
- target:
    kind: Service
    name: mockup
  patch: |-
    - op: replace
      path: /spec/clusterIP
      value: 10.96.200.13
# Resolves PLACEHOLDER_CLIENT, PLACEHOLDER_CLIENTS_MOUNT, and
# PLACEHOLDER_TLS_SECRET
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: /clients/XE9712_iDRAC10_1_30_07_10_mockup_client
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /redfish-clients
    - op: replace
      path: /spec/template/spec/volumes/1/secret/secretName
      value: redfish-xe9712-tls
# Resolves PLACEHOLDER_TLS_SECRET
- target:
    kind: Certificate
    name: tls
  patch: |-
    - op: replace
      path: /spec/secretName
      value: redfish-xe9712-tls
# Resolves BMC placeholders
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-xe9712-mockup
    - op: replace
      path: /spec/hostname
      value: dell-xe9712-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.13
# Resolves BMCSecret credential placeholders
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar

replacements:
# Resolves SERVICE_NAME
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.name
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 0
      create: true
# Resolves SERVICE_NAMESPACE
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 1
      create: true
