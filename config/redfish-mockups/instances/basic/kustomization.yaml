# Instance overlay for the iDRAC basic config mockup client.
#
#   PLACEHOLDER_CLIENT -> /clients/iDRAC_mockup_client_basic_config
#   PLACEHOLDER_CLIENTS_MOUNT -> /redfish-clients
#   PLACEHOLDER_TLS_SECRET -> redfish-basic-tls
#   PLACEHOLDER_BMC_SECRET_NAME -> redfish-basic-mockup
#   PLACEHOLDER_HOSTNAME -> dell-basic-mockup
#   PLACEHOLDER_BMC_IP -> 10.96.200.15
#   PLACEHOLDER_USERNAME / PLACEHOLDER_PASSWORD -> foo / bar
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/mockup

namePrefix: redfish-basic-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: basic

patches:
- target:
    kind: Service
    name: mockup
  patch: |-
    - op: replace
      path: /spec/clusterIP
      value: 10.96.200.15
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: /clients/iDRAC_mockup_client_basic_config
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /redfish-clients
    - op: replace
      path: /spec/template/spec/volumes/1/secret/secretName
      value: redfish-basic-tls
- target:
    kind: Certificate
    name: tls
  patch: |-
    - op: replace
      path: /spec/secretName
      value: redfish-basic-tls
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-basic-mockup
    - op: replace
      path: /spec/hostname
      value: dell-basic-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.15
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar

replacements:
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.name
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 0
      create: true
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 1
      create: true
