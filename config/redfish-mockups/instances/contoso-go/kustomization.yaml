# Instance overlay for the built-in Contoso Go mockup (embedded data).
#
#   No -data flag and no hostPath mount -> the server uses its embedded
#   Contoso Redfish data served at /redfish/v1 over HTTP.
#   PLACEHOLDER_BMC_SECRET_NAME -> redfish-contoso-go-mockup
#   PLACEHOLDER_HOSTNAME -> contoso-go-mockup
#   PLACEHOLDER_BMC_IP -> 10.96.200.26
#   PLACEHOLDER_USERNAME / PLACEHOLDER_PASSWORD -> foo / bar
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/go-mockup

namePrefix: redfish-contoso-go-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: contoso-go

patches:
- target:
    kind: Service
    name: mockup
  patch: |-
    - op: replace
      path: /spec/clusterIP
      value: 10.96.200.26
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: remove
      path: /spec/template/spec/containers/0/args/3
    - op: remove
      path: /spec/template/spec/containers/0/args/2
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts
    - op: remove
      path: /spec/template/spec/volumes
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-contoso-go-mockup
    - op: replace
      path: /spec/hostname
      value: contoso-go-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.26
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar
