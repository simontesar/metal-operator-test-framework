# Instance overlay for the R660xs iDRAC Go mockup client.
#
#   -data path -> /clients/R660xs_iDRAC9_7_20_10_05_mockup_client/redfish/v1
#   PLACEHOLDER_CLIENTS_MOUNT -> /redfish-clients
#   PLACEHOLDER_BMC_SECRET_NAME -> redfish-r660-go-mockup
#   PLACEHOLDER_HOSTNAME -> dell-r660xs-go-mockup
#   PLACEHOLDER_BMC_IP -> 10.96.200.20
#   PLACEHOLDER_USERNAME / PLACEHOLDER_PASSWORD -> foo / bar
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/go-mockup

namePrefix: redfish-r660-go-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: r660-go

patches:
- target:
    kind: Service
    name: mockup
  patch: |-
    - op: replace
      path: /spec/clusterIP
      value: 10.96.200.20
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/3
      value: /clients/R660xs_iDRAC9_7_20_10_05_mockup_client/redfish/v1
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /redfish-clients
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-r660-go-mockup
    - op: replace
      path: /spec/hostname
      value: dell-r660xs-go-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.20
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar
