# Instance overlay for the R660xs iDRAC mockup client.
#
# Placeholders in ../../components/mockup/ and how this file resolves them:
#
#   PLACEHOLDER_CLIENT (Deployment container args)
#     -> /clients/R660xs_iDRAC9_7_20_10_05_mockup_client
#
#   PLACEHOLDER_CLIENTS_MOUNT (Deployment hostPath volume path)
#     -> /redfish-clients (Kind node path from KIND_EXTRA_MOUNTS)
#
#   PLACEHOLDER_TLS_SECRET (Deployment volume + Certificate spec.secretName)
#     -> redfish-r660-tls (after namePrefix on Certificate metadata name)
#
#   SERVICE_NAME / SERVICE_NAMESPACE (Certificate spec.dnsNames)
#     -> redfish-r660-mockup / metal-operator-system
#
#   PLACEHOLDER_BMC_SECRET_NAME (BMC spec.bmcSecretRef.name)
#     -> redfish-r660-mockup
#
#   PLACEHOLDER_HOSTNAME (BMC spec.hostname)
#     -> dell-r660xs-mockup
#
#   PLACEHOLDER_BMC_IP (BMC spec.access.ip)
#     -> 10.96.200.10 (matches Service clusterIP)
#
#   PLACEHOLDER_USERNAME / PLACEHOLDER_PASSWORD (BMCSecret stringData)
#     -> foo / bar
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metal-operator-system

components:
- ../../components/mockup

namePrefix: redfish-r660-

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/instance: r660

patches:
# Resolves PLACEHOLDER_CLIENT, PLACEHOLDER_CLIENTS_MOUNT, and
# PLACEHOLDER_TLS_SECRET
- target:
    kind: Deployment
    name: mockup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: /clients/R660xs_iDRAC9_7_20_10_05_mockup_client
    - op: replace
      path: /spec/template/spec/volumes/0/hostPath/path
      value: /redfish-clients
    - op: replace
      path: /spec/template/spec/volumes/1/secret/secretName
      value: redfish-r660-tls
# Resolves PLACEHOLDER_TLS_SECRET
- target:
    kind: Certificate
    name: tls
  patch: |-
    - op: replace
      path: /spec/secretName
      value: redfish-r660-tls
# Resolves BMC placeholders
- target:
    kind: BMC
    name: mockup
  patch: |-
    - op: replace
      path: /spec/bmcSecretRef/name
      value: redfish-r660-mockup
    - op: replace
      path: /spec/hostname
      value: dell-r660xs-mockup
    - op: replace
      path: /spec/access/ip
      value: 10.96.200.10
# Resolves BMCSecret credential placeholders
- target:
    kind: BMCSecret
    name: mockup
  patch: |-
    - op: replace
      path: /stringData/username
      value: foo
    - op: replace
      path: /stringData/password
      value: bar

replacements:
# Resolves SERVICE_NAME
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.name
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 0
      create: true
# Resolves SERVICE_NAMESPACE
- source:
    kind: Service
    name: mockup
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: Certificate
      name: tls
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: "."
      index: 1
      create: true
