apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedhcp
  namespace: fedhcp-system
  labels:
    app: fedhcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fedhcp
  template:
    metadata:
      labels:
        app: fedhcp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: fedhcp
        image: fedhcp:latest
        imagePullPolicy: IfNotPresent
        args:
        - -config=/etc/fedhcp/config.yaml
        - -loglevel=info
        ports:
        - name: dhcp4
          containerPort: 67
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /etc/fedhcp
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fedhcp-config
